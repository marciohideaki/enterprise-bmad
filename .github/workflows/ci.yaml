name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HSEOS_GOVERNANCE_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install isolation backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm test

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the commit-hygiene gate can scan the PR range
          # (origin/<base>..HEAD) in addition to the HEAD commit message.
          fetch-depth: 0
      - run: npm ci
      # Server-side enforcement of the HSEOS governance gates (ADR-0015 Gate 7
      # included). The local .husky/pre-commit hook is bypassable with
      # --no-verify; this job is the non-bypassable PR-time enforcement point
      # and a required status check on master. The `ci` phase adds the
      # tracked-tree secret scan and commit-message hygiene on top of the doc
      # gates (gate_code is covered by the `test` job).
      - name: HSEOS governance quality gates
        run: VALIDATION_ENFORCED=true bash scripts/governance/quality-gates.sh --phase ci
